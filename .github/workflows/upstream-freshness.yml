name: upstream-freshness

# Fails when an upstream commit since the vendored stamp changed a vendored
# path (SKILL.md or references/), so the one-directional sync obligation
# cannot silently lapse (the vendored copies once drifted a full version
# behind). Upstream commits that touch only CI or docs do not count. Scheduled weekly and runnable on demand;
# it never runs on push or pull_request, so it never blocks normal development
# (vendor-sync-check reports the same staleness there as a warning). A stale
# or unverifiable result fails the run, which surfaces in the Actions tab and
# notifies the maintainer; clear it by re-syncing with scripts/sync-upstream.
#
# GitHub disables scheduled workflows in a public repository after 60 days
# without repository activity. If the Actions tab shows this workflow as
# disabled, re-enable it there or with:
#   gh workflow enable upstream-freshness.yml

on:
  schedule:
    - cron: "17 9 * * 1"   # Mondays 09:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Compare vendored skills against their upstreams
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh scripts/check-upstream-freshness
