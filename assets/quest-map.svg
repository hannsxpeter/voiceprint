<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="t d">
  <title id="t">voiceprint quest map</title>
  <desc id="d">Three levels. 1 Diagnose: authenticity read on the original. 2 Clean and rewrite once. 3 Residual: report what remains, never loop.</desc>
  <style>
    .sans{font-family:"Avenir Next","Helvetica Neue",Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
  </style>
  <rect x="0.5" y="0.5" width="1199" height="419" rx="10" fill="#0E141B" stroke="#243140"/>
  <path d="M1 44H1199V11a10 10 0 0 0-10-10H11A10 10 0 0 0 1 11Z" fill="#162029"/>
  <line x1="1" y1="44" x2="1199" y2="44" stroke="#243140"/>
  <text x="32" y="28" class="mono" font-size="13" font-weight="700" fill="#4FC3F7" letter-spacing="1.5">QUEST MAP</text>
  <text x="1168" y="28" class="mono" font-size="13" fill="#7F91A3" text-anchor="end">DIAGNOSE TO RESIDUAL  3 LEVELS</text>
  <path d="M220 230H980" fill="none" stroke="#4FC3F7" stroke-width="2" stroke-dasharray="3 7" stroke-linecap="round"/>

  <g transform="translate(48 84)">
    <rect width="340" height="280" rx="4" fill="#162029" stroke="#4FC3F7"/>
    <text x="24" y="54" class="mono" font-size="38" font-weight="700" fill="#4FC3F7">01</text>
    <text x="24" y="96" class="sans" font-size="28" font-weight="700" fill="#E8F0F7">Diagnose</text>
    <text x="24" y="124" class="sans" font-size="14" fill="#7F91A3">Score the immutable original.</text>
    <line x1="24" y1="144" x2="316" y2="144" stroke="#243140"/>
    <text x="24" y="172" class="mono" font-size="11" fill="#7F91A3" letter-spacing="1.5">CLEAR IT WITH</text>
    <text x="24" y="200" class="mono" font-size="15" font-weight="700" fill="#E8F0F7">authenticity-check</text>
    <text x="24" y="224" class="mono" font-size="15" font-weight="700" fill="#E8F0F7">before read only</text>
    <line x1="24" y1="244" x2="316" y2="244" stroke="#243140"/>
    <text x="24" y="268" class="sans" font-size="13" fill="#7F91A3">Reward: Before + authenticity read</text>
    <rect x="252" y="24" width="64" height="22" rx="3" fill="#4FC3F7"/>
    <text x="284" y="39" class="mono" font-size="12" font-weight="700" fill="#0E141B" text-anchor="middle" letter-spacing="1.5">START</text>
  </g>

  <g transform="translate(430 84)">
    <rect width="340" height="280" rx="4" fill="#162029" stroke="#243140"/>
    <text x="24" y="54" class="mono" font-size="38" font-weight="700" fill="#4FC3F7">02</text>
    <text x="24" y="96" class="sans" font-size="28" font-weight="700" fill="#E8F0F7">Clean + Rewrite</text>
    <text x="24" y="124" class="sans" font-size="14" fill="#7F91A3">Hygiene once, humanizer once.</text>
    <line x1="24" y1="144" x2="316" y2="144" stroke="#243140"/>
    <text x="24" y="172" class="mono" font-size="11" fill="#7F91A3" letter-spacing="1.5">CLEAR IT WITH</text>
    <text x="24" y="200" class="mono" font-size="15" font-weight="700" fill="#E8F0F7">text_hygiene.py clean</text>
    <text x="24" y="224" class="mono" font-size="15" font-weight="700" fill="#E8F0F7">humanizer (one pass)</text>
    <line x1="24" y1="244" x2="316" y2="244" stroke="#243140"/>
    <text x="24" y="268" class="sans" font-size="13" fill="#7F91A3">Reward: After + what changed</text>
  </g>

  <g transform="translate(812 84)">
    <rect width="340" height="280" rx="4" fill="#162029" stroke="#243140"/>
    <text x="24" y="54" class="mono" font-size="38" font-weight="700" fill="#4FC3F7">03</text>
    <text x="24" y="96" class="sans" font-size="28" font-weight="700" fill="#E8F0F7">Residual</text>
    <text x="24" y="124" class="sans" font-size="14" fill="#7F91A3">Report only. Never rewrite again.</text>
    <line x1="24" y1="144" x2="316" y2="144" stroke="#243140"/>
    <text x="24" y="172" class="mono" font-size="11" fill="#7F91A3" letter-spacing="1.5">CLEAR IT WITH</text>
    <text x="24" y="200" class="mono" font-size="15" font-weight="700" fill="#E8F0F7">cold re-diagnose</text>
    <text x="24" y="224" class="mono" font-size="15" font-weight="700" fill="#E8F0F7">human judgment next</text>
    <line x1="24" y1="244" x2="316" y2="244" stroke="#243140"/>
    <text x="24" y="268" class="sans" font-size="13" fill="#7F91A3">Reward: Residual + stop</text>
  </g>
</svg>
