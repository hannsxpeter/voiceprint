name: vendor-sync-check

# Runs every repository check on each push and pull request through
# scripts/check: the hygiene and repository test suites (which also cover
# shell syntax, eval JSON, version consistency, adapter routing, workflow
# pinning, and the dash policy) and the vendored sync-header and reference
# validation. Vendored content is synced copy, never the source of truth:
# the header is the contract that records the true canonical upstream and
# source commit. On pushes, a vendored copy that has fallen behind its
# upstream is reported as a warning and never fails the build. Checkout keeps
# no credentials, so code from a pull request cannot read the token.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  vendor-sync-check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the documented minimum for scripts/text_hygiene.py. The
        # "Protect main" ruleset requires both jobs by name, so a change here
        # needs the ruleset's required checks updated before merging.
        python-version: ["3.11", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run repository checks
        run: sh scripts/check -v

      - name: Report upstream freshness (warning only)
        if: matrix.python-version == '3.14' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=0
          sh scripts/check-upstream-freshness || status=$?
          if [ "$status" -eq 1 ]; then
            echo "::warning title=Vendored skills are behind upstream::Run scripts/sync-upstream, then scripts/check-vendor-headers, and commit vendor/."
          elif [ "$status" -ne 0 ]; then
            echo "::notice title=Upstream freshness not checked::The freshness check could not reach the upstream repositories."
          fi
